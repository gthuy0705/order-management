name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Only the test database is needed; dev data never exists in CI.
          POSTGRES_DB: orders_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      # DATABASE_URL must differ from TEST_DATABASE_URL (guard in vitest config);
      # nothing in `npm run check` connects to it.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orders_dev
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orders_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Migrate test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - run: npm run check
