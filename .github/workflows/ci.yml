name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the running workflow obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Each must differ from the others (guards in vitest/playwright config).
  # DATABASE_URL is never connected to in CI; it only has to be valid.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orders_dev
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orders_test
  E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orders_e2e

jobs:
  check:
    name: Typecheck, lint, unit + integration, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orders_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails on high/critical advisories in production dependencies. The
      # Prisma CLI advisory accepted in README ("Rủi ro đã chấp nhận") is a
      # dev-time tool and is listed in .github/audit-allowlist.txt.
      - name: Audit dependencies
        run: node .github/scripts/audit.mjs

      - name: Migrate test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - run: npm run check

      # Catches what only a production build sees (prerendering, Suspense and
      # cacheComponents rules, bundling of server-only code).
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: check

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orders_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # globalSetup migrates the e2e database and creates the e2e user; the
      # web server builds and starts the app in production mode.
      - run: npm run e2e
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
